[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Pin the EVM target (audit 2026-07-24 SC-9): solc 0.8.24 already defaults to
# cancun, but pinning makes the deployed bytecode target explicit and immune to
# a future solc bump changing the default. Base supports Cancun (MCOPY/TSTORE).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Allow tests to read the shared bundle oracle. test/MiniSets.t.sol pins the
# contract's _rangeForBundle to bundle-oracle.json — the SAME repo-root file the
# backend (config/bundles) and frontend (lib/bundles) suites read, so all three
# layers derive their 26 day-ranges from one source.
fs_permissions = [{ access = "read", path = "./bundle-oracle.json" }]

# Development profile (fast compilation)
[profile.dev]
via_ir = false

# Production profile (optimized)
[profile.production]
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

remappings = [
    '@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/',
    '@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/',
]

# RPC endpoints
[rpc_endpoints]
base = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

# Etherscan/Basescan verification
[etherscan]
base = { key = "${BASESCAN_API_KEY}" }
base_sepolia = { key = "${BASESCAN_API_KEY}" }